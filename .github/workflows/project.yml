name: project
on:
  push:
    branches:
    - init
jobs:
    build:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 💡 Creando proyecto en git
        run: |
         curl -X POST https://api.github.com/repos/${{ github.repository }}/projects \
         -H "Accept: application/vnd.github.v3+json" \
         -H "Authorization: token ${{ secrets.MY_GITHUB_PAT }}" \
         -d '{
           "name": "${{ github.event.repository.name }}",
           "body": "Este es un proyecto creado automáticamente con GitHub Actions."
         }'
